# KreupAI ManithPro - Pull Request Preview Deployment
# Creates preview environments for pull requests

name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  # ==========================================================================
  # Build Preview
  # ==========================================================================
  build-preview:
    name: Build Preview
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PREVIEW_API_URL }}

      # Option 1: Deploy to Vercel
      - name: Deploy to Vercel
        id: deploy-vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          alias-domains: pr-${{ env.PR_NUMBER }}.manithpro.vercel.app
        continue-on-error: true

      # Option 2: Deploy to Netlify
      - name: Deploy to Netlify
        id: deploy-netlify
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: './frontend/dist'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ env.PR_NUMBER }}: ${{ github.event.pull_request.title }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          alias: pr-${{ env.PR_NUMBER }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        continue-on-error: true

      - name: Set preview URL
        id: deploy
        run: |
          if [[ -n "${{ steps.deploy-vercel.outputs.preview-url }}" ]]; then
            echo "preview_url=${{ steps.deploy-vercel.outputs.preview-url }}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ steps.deploy-netlify.outputs.deploy-url }}" ]]; then
            echo "preview_url=${{ steps.deploy-netlify.outputs.deploy-url }}" >> $GITHUB_OUTPUT
          else
            echo "preview_url=Preview deployment not available" >> $GITHUB_OUTPUT
          fi

  # ==========================================================================
  # Lighthouse Audit
  # ==========================================================================
  lighthouse-audit:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: [build-preview]
    if: needs.build-preview.outputs.preview_url != 'Preview deployment not available'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ needs.build-preview.outputs.preview_url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment Lighthouse results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('lhci_reports/manifest.json'));
            const summary = results[0].summary;

            const formatScore = (score) => {
              if (score >= 0.9) return `🟢 ${Math.round(score * 100)}`;
              if (score >= 0.5) return `🟡 ${Math.round(score * 100)}`;
              return `🔴 ${Math.round(score * 100)}`;
            };

            const comment = `## 🔦 Lighthouse Report

            | Category | Score |
            |----------|-------|
            | Performance | ${formatScore(summary.performance)} |
            | Accessibility | ${formatScore(summary.accessibility)} |
            | Best Practices | ${formatScore(summary['best-practices'])} |
            | SEO | ${formatScore(summary.seo)} |

            [Full Report](${{ needs.build-preview.outputs.preview_url }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  # ==========================================================================
  # Visual Regression Testing
  # ==========================================================================
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [build-preview]
    if: needs.build-preview.outputs.preview_url != 'Preview deployment not available'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -g playwright
          npx playwright install chromium

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          npx playwright screenshot \
            --wait-for-selector "body" \
            "${{ needs.build-preview.outputs.preview_url }}" \
            screenshots/home.png
        continue-on-error: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: screenshots/
          retention-days: 7

  # ==========================================================================
  # Comment Preview URL
  # ==========================================================================
  comment-preview:
    name: Comment Preview URL
    runs-on: ubuntu-latest
    needs: [build-preview, lighthouse-audit]
    if: always() && needs.build-preview.result == 'success'

    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## 🚀 Preview Deployment'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Deployment

            | Status | URL |
            |--------|-----|
            | ✅ Ready | ${{ needs.build-preview.outputs.preview_url }} |

            **Commit:** ${{ github.event.pull_request.head.sha }}

            ---
            <details>
            <summary>📝 Preview Details</summary>

            - **PR:** #${{ github.event.pull_request.number }}
            - **Branch:** `${{ github.event.pull_request.head.ref }}`
            - **Updated:** ${{ github.event.pull_request.updated_at }}

            </details>

  # ==========================================================================
  # Cleanup on PR Close
  # ==========================================================================
  cleanup:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Delete preview deployment
        run: |
          echo "Cleaning up preview deployment for PR #${{ env.PR_NUMBER }}"
          # Add cleanup logic for your preview platform
          # Vercel: vercel remove pr-${{ env.PR_NUMBER }}.manithpro.vercel.app
          # Netlify: netlify api deleteDeployLock
