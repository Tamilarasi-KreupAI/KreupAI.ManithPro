<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - KreupAI Recruitment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-center;
      color: #333;
    }

    .container {
      text-align: center;
      background: white;
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      margin: 1rem;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    h1 {
      font-size: 2rem;
      color: #2563eb;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
    }

    .features {
      margin-top: 2rem;
      text-align: left;
      background: #f9fafb;
      padding: 1.5rem;
      border-radius: 10px;
    }

    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    .feature:last-child {
      margin-bottom: 0;
    }

    .feature-icon {
      margin-right: 0.75rem;
      font-size: 1.2rem;
    }

    .status {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #fef3c7;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #92400e;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry, some features
      are still available while you're offline!
    </p>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">✅</span>
        <span>View previously loaded jobs and applications</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✅</span>
        <span>Browse your profile and saved content</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✅</span>
        <span>Changes will sync when you're back online</span>
      </div>
    </div>

    <div class="status">
      <span id="status">Waiting for connection...</span>
    </div>

    <button class="btn" onclick="window.location.reload()" style="margin-top: 1.5rem;">
      Try Again
    </button>
  </div>

  <script>
    // Check connection status
    function updateOnlineStatus() {
      const statusEl = document.getElementById('status');
      if (navigator.onLine) {
        statusEl.textContent = 'Connection restored!';
        statusEl.parentElement.style.background = '#d1fae5';
        statusEl.parentElement.style.color = '#065f46';
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      } else {
        statusEl.textContent = 'Waiting for connection...';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Check connection every 5 seconds
    setInterval(() => {
      if (navigator.onLine) {
        updateOnlineStatus();
      }
    }, 5000);
  </script>
</body>
</html>
